<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>IntelliTrack settings</title>
<link rel="stylesheet" href="ui.css">
<style>.page{max-width:620px} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}</style>
</head><body>
<main class="page">
  <div class="page-head"><svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#4f46e5"/><circle cx="14" cy="14" r="7.4" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="14" cy="14" r="2.9" fill="#fff"/></svg><div><h1>LLM settings</h1><p class="muted">Bring your own model. Requests go straight from this browser to the endpoint below; there is no IntelliTrack server.</p></div></div>

  <div class="card stack">
    <label class="field">Provider<select id="provider"></select></label>
    <label class="field">Base URL<input id="base_url" type="text" placeholder="https://…" spellcheck="false"></label>
    <label class="field">Model<input id="model" type="text" spellcheck="false"><span id="model-hint" class="hint"></span></label>
    <label class="field">API key<input id="api_key" type="password" autocomplete="off" spellcheck="false"></label>
    <div class="note warn">The key is stored <b>unencrypted</b> in this browser (<code>chrome.storage.local</code>). Use a dedicated key with a spending cap, never your main one.</div>
  </div>

  <details class="disclosure" style="margin-top:20px">
    <summary>Limits &amp; budget</summary>
    <div class="card stack">
      <div class="grid2">
        <label class="field">Max output tokens<input id="max_output_tokens" type="number" min="256" max="16000"></label>
        <label class="field">Timeout (seconds)<input id="timeout_s" type="number" min="5" max="600"></label>
        <label class="field">Plan calls per session<input id="max_per_session" type="number" min="1" max="50"></label>
        <label class="field">Seconds between plan calls<input id="min_interval_s" type="number" min="0" max="3600"></label>
      </div>
    </div>
  </details>

  <div class="row" style="margin-top:24px"><button id="save" class="btn primary">Save</button><button id="test" class="btn secondary">Test connection</button></div>
  <div id="msg" style="margin-top:14px"></div>
  <div id="version" class="hint" style="margin-top:28px"></div>
</main>
<script src="options.js"></script>
</body></html>
