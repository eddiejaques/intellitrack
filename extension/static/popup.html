<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>IntelliTrack</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 360px; max-height: 600px; overflow-y: auto; }
  .wrap { padding: 14px 14px 12px; display: grid; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; }
  header .title { font-weight: 650; font-size: 14px; letter-spacing: -.01em; }

  .hero { display: grid; gap: 14px; padding: 16px; }
  .hero-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex: none; }
  .dot.rec { background: var(--sev-critical); box-shadow: 0 0 0 0 color-mix(in srgb, var(--sev-critical) 50%, transparent); animation: pulse 1.8s infinite; }
  .dot.done { background: var(--ok); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .dot.rec { animation: none; } }
  .count { font-size: 44px; line-height: 1; font-weight: 650; letter-spacing: -.03em; }
  .count small { font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 6px; }

  #llm-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #llm-status button { all: unset; cursor: pointer; color: var(--accent); }
  #llm-status button:hover { text-decoration: underline; }

  /* plan as a timeline */
  .plan-head { display: flex; align-items: center; gap: 8px; }
  .journey { display: grid; gap: 2px; }
  .journey-head { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-weight: 600; }
  .step { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: start; padding: 7px 0; position: relative; }
  .step:not(:last-child)::before { content: ""; position: absolute; left: 8.5px; top: 27px; bottom: -7px; width: 1px; background: var(--border); }
  .step.off { opacity: .45; }
  .state { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: var(--surface); margin-top: 1px; position: relative; flex: none; }
  .state.done { background: var(--accent); border-color: var(--accent); }
  .state.done::after { content: ""; position: absolute; left: 5.5px; top: 2.5px; width: 4px; height: 8px; border: solid var(--accent-fg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .state.partial { border-color: var(--accent); background: conic-gradient(var(--accent) 0 50%, var(--surface) 0); }
  .step .name { font-weight: 500; }
  .step .evs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .step .actions { display: flex; align-items: center; gap: 6px; }

  .markers { display: flex; flex-wrap: wrap; gap: 6px; }
  footer { display: flex; align-items: center; gap: 2px; padding-top: 2px; }
  pre.json { max-height: 150px; }
</style></head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="#4f46e5"/><circle cx="14" cy="14" r="7.4" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="14" cy="14" r="2.9" fill="#fff"/></svg>
    <span class="title">IntelliTrack</span>
    <span class="spacer"></span>
    <button id="settings" class="btn ghost icon" title="LLM settings" aria-label="LLM settings">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 6h7M14 6h3M3 14h3M10 14h7"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="14" r="2"/></svg>
    </button>
  </header>

  <section class="card hero">
    <div class="hero-top"><span id="dot" class="dot"></span><span id="status">Idle</span></div>
    <div class="count"><span id="count">0</span><small>events</small></div>
    <button id="toggle" class="btn primary block">Start recording</button>
    <div id="llm-status"></div>
  </section>

  <div id="plan" class="stack"></div>

  <div id="free-marker" class="row hide">
    <input type="text" id="marker-name" placeholder="Name this step, e.g. Add to cart">
    <button id="marker" class="btn secondary sm">Mark</button>
  </div>
  <div id="markers" class="markers"></div>

  <footer>
    <button id="panel" class="btn ghost sm">Live panel</button>
    <button id="history" class="btn ghost sm">Sessions</button>
    <button id="clear" class="btn ghost sm hide">Clear</button>
    <span class="spacer"></span>
    <button id="preview" class="btn secondary">Audit with LLM →</button>
  </footer>
</div>
<script src="popup.js"></script>
</body></html>
